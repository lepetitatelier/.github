name: I built this
description: You printed, built or adapted one of our projects. We'd love to see it.
title: "Build: "
labels: [build-report]
body:
  - type: markdown
    attributes:
      value: |
        This is the best way to help an open project: tell us how it went. What worked and what didn't both help the
        next person.
  - type: textarea
    id: photos
    attributes:
      label: Photos
      description: Drag photos here. Please don't include people without their consent.
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How did it go?
      description: Machine, material, time, cost, anything you changed, anything that was hard.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where are you?
      description: Optional. Town or country is enough.
  - type: checkboxes
    id: share
    attributes:
      label: Sharing
      options:
        - label: Le Petit Atelier may show these photos on lepetitatelier.nz and social media, with credit.
